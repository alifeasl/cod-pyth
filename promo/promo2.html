<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Scroll Stopper</title>
<style>
@font-face{font-family:Cairo;src:url(fonts/cairo-arabic.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0600-06FF,U+FB50-FDFF,U+FE70-FEFC,U+200C-200E;}
@font-face{font-family:Cairo;src:url(fonts/cairo-latin.woff2) format('woff2');font-weight:200 1000;unicode-range:U+0000-00FF,U+2000-206F,U+2713,U+2715;}
:root{--bg:#070B18;--navy:#111A36;--gold:#F4C542;--gold2:#C8901E;--white:#F5F3EE;--mute:#8D93A8;--red:#FF4B4B}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:540px;height:960px;overflow:hidden;background:var(--bg);font-family:Cairo,sans-serif}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(120% 70% at 50% 45%,#17224a 0%,#0b1125 55%,#05070f 100%)}
.scene{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.abs{position:absolute}
.full{width:100%;text-align:center}
.gold{background:linear-gradient(180deg,#FFE7A1 0%,#F4C542 45%,#C8901E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{filter:drop-shadow(0 0 18px rgba(244,197,66,.45))}
.w{display:inline-block;margin:0 6px}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(90% 60% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%)}
#flash{position:absolute;inset:0;background:#FFE7A1;opacity:0;mix-blend-mode:screen}
.tag{position:absolute;padding:6px 18px;border-radius:30px;font-weight:900;font-size:22px;white-space:nowrap}
.post{position:absolute;left:0;width:100%;height:200px;border-radius:14px;overflow:hidden}
.pill{position:absolute;left:50%;width:420px;margin-left:-210px;height:84px;border-radius:24px;background:rgba(17,26,54,.75);border:2px solid rgba(244,197,66,.75);display:flex;align-items:center;gap:16px;padding:0 16px;box-shadow:0 0 30px rgba(244,197,66,.15) inset}
.pill .ic{width:56px;height:56px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:none}
.pill .tx{font-weight:900;font-size:36px;color:var(--white);direction:ltr;letter-spacing:1px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="dust" width="540" height="960" class="abs" style="left:0;top:0"></canvas>
  <div id="streak" class="abs" style="left:-300px;top:-200px;width:120px;height:1500px;background:linear-gradient(90deg,transparent,rgba(255,231,161,.18),transparent);transform:rotate(25deg)"></div>

  <!-- ===== S1 : ثانية وحدة ===== -->
  <div class="scene" id="s1">
    <div class="abs full" id="s1a" style="top:262px;font-weight:900;font-size:84px;line-height:1.1"><span class="w gold glow" id="w1">ثانية</span><span class="w gold glow" id="w2">وحدة</span></div>
    <div class="abs full" id="s1b" style="top:420px;font-weight:800;font-size:36px;color:var(--white)">هي اللي تقرّر إذا الزبون…</div>
    <div class="abs full" id="s1c" style="top:490px;font-weight:900;font-size:56px;color:var(--white)"><span class="w gold" id="w3">يوگف</span><span class="w" id="w4" style="color:var(--mute)">لو يعبر؟</span></div>
    <div class="abs" id="s1line" style="left:120px;top:600px;width:300px;height:5px;border-radius:3px;background:linear-gradient(90deg,#C8901E,#FFE7A1,#C8901E);transform-origin:center"></div>
  </div>

  <!-- ===== S2 : فيد السوشيال ===== -->
  <div class="scene" id="s2">
    <div class="abs full" id="s2t1" style="top:135px;font-weight:900;font-size:44px;color:var(--white)">إعلانك <span class="gold">ينعبر؟</span></div>
    <div class="abs full" id="s2t2" style="top:135px;font-weight:900;font-size:44px;color:var(--white)">خلّيه <span class="gold">يوگّف السكرول</span></div>
    <div class="abs" id="phone" style="left:140px;top:225px;width:260px;height:540px;border-radius:40px;background:#000;border:3px solid #2a3560;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 1px rgba(244,197,66,.2)">
      <div style="position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:#0d1226">
        <div id="feed" class="abs" style="left:10px;right:10px;top:0"></div>
      </div>
    </div>
    <div class="tag" id="tagBad" style="left:22px;top:330px;background:#2a1220;color:var(--red);border:2px solid var(--red)">✕ ينعبر</div>
    <div class="tag" id="tagGood" style="left:340px;top:610px;background:var(--gold);color:#111">✓ يوگّف السكرول</div>
    <div class="abs" id="ripple" style="left:270px;top:495px;width:0;height:0"></div>
  </div>

  <!-- ===== S3 : الخطوات ===== -->
  <div class="scene" id="s3">
    <div class="abs full" id="s3h" style="top:140px;font-weight:800;font-size:30px;color:var(--mute)">شلون نشتغل؟</div>
    <div id="steps"></div>
    <div class="abs" id="dots" style="left:220px;top:690px;width:100px;display:flex;justify-content:space-between;direction:ltr"></div>
  </div>

  <!-- ===== S4 : مونتاج كلمات ===== -->
  <div class="scene" id="s4">
    <div class="abs full" id="s4h" style="top:300px;font-weight:800;font-size:32px;color:var(--white)">نسوّيلك</div>
    <div class="abs full gold glow" id="s4w" style="top:370px;font-weight:900;font-size:84px;line-height:1.2"></div>
    <div id="rings"></div>
  </div>

  <!-- ===== S5 : اللوجو + التواصل ===== -->
  <div class="scene" id="s5">
    <div id="burst" class="abs" style="left:270px;top:300px;width:0;height:0"></div>
    <div class="abs" id="logo" style="left:120px;top:150px;width:300px;height:250px">
      <img src="img/logo.png" style="width:100%;height:100%;filter:drop-shadow(0 0 22px rgba(244,197,66,.35))">
      <div id="shine" style="position:absolute;inset:0;-webkit-mask:url(img/logo.png) center/100% 100% no-repeat;mask:url(img/logo.png) center/100% 100% no-repeat;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.9) 50%,transparent 60%);background-size:300% 100%;background-position:100% 0"></div>
    </div>
    <div class="abs full" id="cta" style="top:420px;font-weight:900;font-size:42px;color:var(--white)">احجز فيديوك <span class="gold">هسّه</span></div>
    <div class="pill" id="p1" style="top:500px">
      <div class="ic" style="background:linear-gradient(135deg,#FFE7A1,#C8901E)"><svg width="30" height="30" viewBox="0 0 24 24"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z" fill="#111A36"/></svg></div>
      <div class="tx" id="phoneTxt"></div>
    </div>
    <div class="pill" id="p2" style="top:600px">
      <div class="ic" style="background:linear-gradient(45deg,#FEC053,#F2203E 50%,#B729A8 80%,#5342D6)"><svg width="32" height="32" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="12" cy="12" r="4.2" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="17.4" cy="6.6" r="1.3" fill="#fff"/></svg></div>
      <div class="tx" id="igTxt"></div>
    </div>
    <div class="abs full" id="s5f" style="top:715px;font-weight:700;font-size:21px;color:var(--mute)">موشن جرافيك · إعلانات · ستوري وريلز</div>
  </div>

  <div id="vig"></div>
  <div id="flash"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x;
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

const S=[0,2.9,7.2,12.2,14.8,21.0];
const DURATION=S[S.length-1];
// slam impacts (also used by music.py — keep in sync)
const SLAMS=[0.25,0.6,1.45,1.8];

// slam: big -> normal with blur
function slam(el,t,start,dur=.28){
  const p=P(t,start,start+dur);
  el.style.opacity=p>0?Math.min(1,p*3):0;
  el.style.transform=`scale(${lerp(2.6,1,eOut(p))})`;
  el.style.filter=p<1?`blur(${(1-p)*8}px)`:'';
}
function rise(el,t,start,dur=.45,dy=40){
  const p=eOut(P(t,start,start+dur));
  el.style.opacity=p; el.style.transform=`translateY(${(1-p)*dy}px)`;
}

/* ---------- dust particles ---------- */
const dust=[];for(let i=0;i<55;i++)dust.push({x:rnd()*540,y:rnd()*960,r:.6+rnd()*2.2,v:8+rnd()*30,ph:rnd()*6.28});
const ctx=$('dust').getContext('2d');

/* ---------- feed ---------- */
const feed=$('feed');
const POSTS=['plain','plain','boring','plain','plain','hero','plain'];
const PH=214;
POSTS.forEach((k,i)=>{
  const d=document.createElement('div');d.className='post';d.style.top=(i*PH+10)+'px';
  if(k==='plain'){
    d.style.background='#1a2140';
    d.innerHTML=`<div style="position:absolute;left:12px;top:12px;width:26px;height:26px;border-radius:50%;background:#2c3660"></div>
      <div style="position:absolute;left:46px;top:20px;width:80px;height:9px;border-radius:5px;background:#2c3660"></div>
      <div style="position:absolute;left:12px;right:12px;top:50px;bottom:40px;border-radius:10px;background:#232c52"></div>
      <div style="position:absolute;left:12px;bottom:16px;width:120px;height:9px;border-radius:5px;background:#2c3660"></div>`;
  } else if(k==='boring'){
    d.style.background='#d9d9d9';
    d.innerHTML=`<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#555;font-weight:600">
      <div style="font-size:30px;font-weight:700">خصم 20%</div><div style="font-size:15px">على جميع المنتجات</div></div>`;
    d.id='boring';
  } else {
    d.id='hero';
    d.style.background='radial-gradient(circle at 50% 50%,#2b3a78,#0f1530)';
    d.style.boxShadow='0 0 0 3px #F4C542';
    d.innerHTML=`<div id="heroRing" style="position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px;border-radius:50%;border:4px dashed #F4C542"></div>
      <div id="heroPlay" style="position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border-radius:50%;background:linear-gradient(135deg,#FFE7A1,#C8901E);display:flex;align-items:center;justify-content:center">
        <svg width="28" height="28" viewBox="0 0 32 32"><path d="M9 5 L27 16 L9 27Z" fill="#111A36"/></svg></div>
      <div id="heroBars" style="position:absolute;left:14px;bottom:14px;display:flex;gap:4px;align-items:flex-end;height:30px;direction:ltr"></div>
      <div style="position:absolute;right:12px;top:10px;font-weight:900;font-size:16px;color:#F4C542">NEW</div>`;
  }
  feed.appendChild(d);
});
for(let i=0;i<8;i++){const b=document.createElement('i');b.style.cssText='display:block;width:6px;border-radius:3px;background:#F4C542';$('heroBars').appendChild(b);}
// ripple rings
for(let i=0;i<3;i++){const r=document.createElement('div');r.className='abs';r.style.cssText='border:3px solid #F4C542;border-radius:50%';$('ripple').appendChild(r);}

/* ---------- steps ---------- */
const STEPS=[['01','احچيلنا فكرتك','رسالة وحدة على الواتساب تكفي'],
             ['02','نكتب، نصمّم ونحرّك','سكربت + تصميم + تعليق صوتي'],
             ['03','تستلم فيديو جاهز','للستوري، الريلز والإعلان الممول']];
const stepEls=STEPS.map((s,i)=>{
  const g=document.createElement('div');g.className='abs';g.style.cssText='left:0;top:0;width:100%;height:100%';
  g.innerHTML=`<div class="abs full" style="top:200px;font-weight:900;font-size:190px;line-height:1;color:transparent;-webkit-text-stroke:3px #F4C542;direction:ltr" data-r="num">${s[0]}</div>
   <div class="abs full" style="top:440px;font-weight:900;font-size:44px;color:#F5F3EE" data-r="t">${s[1]}</div>
   <div class="abs full" style="top:515px;font-weight:700;font-size:23px;color:#8D93A8" data-r="s">${s[2]}</div>
   <div class="abs" style="left:170px;top:590px;width:200px;height:4px;border-radius:2px;background:#F4C542;transform-origin:right" data-r="bar"></div>`;
  $('steps').appendChild(g);
  const dot=document.createElement('i');dot.style.cssText='display:block;width:14px;height:14px;border-radius:50%;background:#2c3660';$('dots').appendChild(dot);
  return {g,dot,num:g.querySelector('[data-r=num]'),t:g.querySelector('[data-r=t]'),s:g.querySelector('[data-r=s]'),bar:g.querySelector('[data-r=bar]')};
});

/* ---------- s4 words ---------- */
const WORDS=['ستوري','ريلز','إعلان ممول','انترو','شعار متحرك','فيديو منتج'];
for(let i=0;i<WORDS.length;i++){const r=document.createElement('div');r.className='abs';r.style.cssText='left:270px;top:425px;border:2px solid rgba(244,197,66,.6);border-radius:50%';$('rings').appendChild(r);}

/* ---------- s5 burst ---------- */
for(let i=0;i<16;i++){const r=document.createElement('div');r.className='abs';
  r.style.cssText=`left:-4px;top:0;width:8px;height:${150+(i%3)*40}px;border-radius:4px;background:linear-gradient(180deg,rgba(244,197,66,.55),transparent);transform-origin:4px 0`;
  $('burst').appendChild(r);}

const PHONE='07830174162', IG='@v6_x6';

function render(t){
  /* background */
  ctx.clearRect(0,0,540,960);
  dust.forEach(d=>{const y=((d.y-t*d.v)%960+960)%960, x=d.x+Math.sin(t+d.ph)*10;
    ctx.globalAlpha=.25+.35*Math.abs(Math.sin(t*1.5+d.ph));ctx.fillStyle='#F4C542';ctx.beginPath();ctx.arc(x,y,d.r,0,6.283);ctx.fill();});
  $('streak').style.left=(-300+((t*260)%1400))+'px';

  for(let i=1;i<=5;i++)$('s'+i).style.display=(t>=S[i-1]&&t<S[i])?'block':'none';

  /* ---- S1 ---- */
  if(t<S[1]){
    slam($('w1'),t,SLAMS[0]); slam($('w2'),t,SLAMS[1]);
    rise($('s1b'),t,1.0,.45);
    slam($('w3'),t,SLAMS[2],.25); slam($('w4'),t,SLAMS[3],.25);
    const lp=eOut(P(t,1.9,2.4)); $('s1line').style.transform=`scaleX(${lp})`;
    // camera shake on slams
    let sh=0;SLAMS.forEach(s=>{const k=t-s-.25;if(k>0&&k<.25)sh+=(1-k/.25)*7;});
    $('s1').style.transform=`translate(${Math.sin(t*90)*sh}px,${Math.cos(t*77)*sh}px) scale(${1+t*.02})`;
  }
  /* ---- S2 ---- */
  if(t>=S[1]&&t<S[2]){
    const lt=t-S[1];
    const swap=P(lt,2.6,2.9);
    $('s2t1').style.opacity=(1-swap)*eOut(P(lt,.15,.5)); $('s2t1').style.transform=`translateY(${-swap*30}px)`;
    $('s2t2').style.opacity=swap; $('s2t2').style.transform=`translateY(${(1-swap)*30}px)`;
    const ph=eOut(P(lt,.1,.6)); $('phone').style.opacity=ph; $('phone').style.transform=`translateY(${(1-ph)*300}px) rotate(${(1-ph)*-8}deg)`;
    // scroll: fast pass over boring, decelerate to hero centered (viewport height ~510, hero index 5)
    const heroY=5*PH+10, target=heroY-(510-200)/2;
    const boringY=2*PH+10-(510-200)/2;
    const y = lt<1.9 ? boringY*eIO(P(lt,.5,1.3)) + (lt>1.3?(lt-1.3)*25:0)
                     : lerp(boringY+15,target,eOut(P(lt,1.9,2.7)));
    const settle=lt>2.7?Math.sin((lt-2.7)*14)*Math.exp(-(lt-2.7)*7)*10:0;
    $('feed').style.transform=`translateY(${-(y+settle)}px)`;
    $('boring').style.filter=`saturate(0)`;
    // bad tag when boring passes center
    const bt=P(lt,1.3,1.6), bo=P(lt,1.95,2.15);
    $('tagBad').style.opacity=bt*(1-bo); $('tagBad').style.transform=`scale(${eBack(bt)}) rotate(-6deg)`;
    // hero animation
    $('heroRing').style.transform=`rotate(${lt*90}deg)`;
    $('heroPlay').style.transform=`scale(${1+Math.sin(lt*7)*.08})`;
    [...$('heroBars').children].forEach((b,i)=>b.style.height=(8+Math.abs(Math.sin(lt*8+i))*22)+'px');
    const gt=P(lt,2.85,3.25); $('tagGood').style.opacity=gt>0?1:0; $('tagGood').style.transform=`scale(${eBack(gt)}) rotate(5deg)`;
    $('tagGood').style.left='auto';$('tagGood').style.right='18px';
    [...$('ripple').children].forEach((r,i)=>{const p=P(lt,2.75+i*.22,3.75+i*.22);const s=p*360;
      r.style.width=r.style.height=s+'px';r.style.left=r.style.top=(-s/2)+'px';r.style.opacity=p>0?(1-p)*.8:0;});
  }
  /* ---- S3 ---- */
  if(t>=S[2]&&t<S[3]){
    const lt=t-S[2];
    rise($('s3h'),t,S[2]+.1,.4,-20);
    const SD=1.6, T0=.35;
    stepEls.forEach((e,i)=>{
      const a=T0+i*SD, inP=P(lt,a,a+.4), outP=i<2?P(lt,a+SD-.25,a+SD):0;
      const vis=lt>=a&&(i===2||lt<a+SD);
      e.g.style.display=vis?'block':'none';
      e.num.style.transform=`translateX(${(1-eOut(inP))*-260+eIn(outP)*300}px) scale(${lerp(1.4,1,eOut(inP))})`;
      e.num.style.opacity=inP*(1-outP);
      const tp=eOut(P(lt,a+.12,a+.5));
      e.t.style.opacity=tp*(1-outP); e.t.style.transform=`translateY(${(1-tp)*30}px) translateX(${eIn(outP)*300}px)`;
      const spp=eOut(P(lt,a+.25,a+.6));
      e.s.style.opacity=spp*(1-outP); e.s.style.transform=`translateX(${eIn(outP)*300}px)`;
      e.bar.style.transform=`scaleX(${P(lt,a+.3,a+SD-.3)*(1-outP)})`;
      e.dot.style.background=lt>=a?'#F4C542':'#2c3660';
      e.dot.style.transform=`scale(${lt>=a&&(i===2||lt<a+SD)?1.3:1})`;
    });
    $('dots').style.opacity=eOut(P(lt,.3,.6));
  }
  /* ---- S4 ---- */
  if(t>=S[3]&&t<S[4]){
    const lt=t-S[3], WD=.4;
    rise($('s4h'),t,S[3]+.05,.3,20);
    const idx=Math.min(WORDS.length-1,Math.floor(Math.max(0,lt-.15)/WD));
    const wl=Math.max(0,lt-.15)-idx*WD;
    $('s4w').textContent=WORDS[idx];
    $('s4w').style.transform=`scale(${lerp(1.5,1,eOut(clamp(wl/.15)))})`;
    $('s4w').style.opacity=lt<.15?0:1;
    [...$('rings').children].forEach((r,i)=>{const p=P(lt,.15+i*WD,.15+i*WD+.7);const s=80+eOut(p)*520;
      r.style.width=r.style.height=s+'px';r.style.marginLeft=r.style.marginTop=(-s/2)+'px';r.style.opacity=p>0&&p<1?(1-p):0;});
  }
  /* ---- S5 ---- */
  if(t>=S[4]){
    const lt=t-S[4];
    const bp=eOut(P(lt,0,.6));
    [...$('burst').children].forEach((r,i)=>{r.style.transform=`rotate(${i*22.5+lt*12}deg) scaleY(${bp*(0.85+0.15*Math.sin(lt*3+i))})`;r.style.opacity=bp*.9;});
    const lp=P(lt,.1,.75);
    $('logo').style.opacity=lp>0?1:0;
    $('logo').style.transform=`scale(${eBack(lp)}) translateY(${Math.sin(lt*1.8)*4}px)`;
    $('logo').style.filter=lp<1?`blur(${(1-lp)*6}px)`:'';
    const sh=P(lt,.8,1.6), sh2=P(lt,4.0,4.8);
    $('shine').style.backgroundPosition=`${100-eIO(sh2>0?sh2:sh)*100}% 0`;
    rise($('cta'),t,S[4]+.9,.45);
    const a1=eOut(P(lt,1.2,1.65)), a2=eOut(P(lt,1.45,1.9));
    $('p1').style.opacity=a1;$('p1').style.transform=`translateX(${(1-a1)*-400}px)`;
    $('p2').style.opacity=a2;$('p2').style.transform=`translateX(${(1-a2)*400}px)`;
    const n1=Math.floor(clamp((lt-1.6)/1.1)*PHONE.length); $('phoneTxt').textContent=PHONE.slice(0,n1)+(n1<PHONE.length&&lt>1.6&&Math.floor(lt*6)%2?'|':'');
    const n2=Math.floor(clamp((lt-2.0)/.7)*IG.length); $('igTxt').textContent=IG.slice(0,n2)+(n2<IG.length&&lt>2.0&&Math.floor(lt*6)%2?'|':'');
    const glowP=lt>3?(.5+.5*Math.sin((lt-3)*4)):0;
    $('p1').style.boxShadow=`0 0 ${10+glowP*25}px rgba(244,197,66,${.15+glowP*.3})`;
    rise($('s5f'),t,S[4]+2.6,.5,15);
  }

  /* ---- transitions: gold flash + punch-in ---- */
  let f=0;
  for(let i=2;i<=5;i++)$('s'+i).style.transform='';
  for(let k=1;k<S.length-1;k++){
    const b=S[k];
    if(t>=b-.08&&t<b+.35){ f=Math.max(f, t<b?(t-b+.08)/.08*.8:.8*(1-eOut((t-b)/.35))); }
    if(t>=b&&t<b+.4){const sc=$('s'+(k+1)); const p=eOut((t-b)/.4); sc.style.transform=`scale(${lerp(1.18,1,p)})`;}
  }
  $('flash').style.opacity=f;
  // fade in/out
  $('stage').style.opacity=Math.min(1,t/.2);
}
window.render=render;window.DURATION=DURATION;
document.fonts.ready.then(()=>{window.READY=true;});
if(!navigator.webdriver){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();}
</script>
