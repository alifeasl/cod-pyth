<script type="module">
import * as THREE from 'three';
import {RoundedBoxGeometry} from './vendor/addons/RoundedBoxGeometry.js';
import {RoomEnvironment} from './vendor/addons/RoomEnvironment.js';

const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};
const S=[0,10,15.5,21,25.5];
const DURATION=S[S.length-1];

/* ---------------- renderer ---------------- */
const renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(540,960,false);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const camera=new THREE.PerspectiveCamera(32,540/960,.1,100);

const hemi=new THREE.HemisphereLight(0xdff1ff,0xf3d2a8,.65);scene.add(hemi);
const key=new THREE.DirectionalLight(0xfff1dc,3.1);key.position.set(3,6,5);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-5;key.shadow.camera.right=5;key.shadow.camera.top=5;key.shadow.camera.bottom=-3;key.shadow.radius=6;key.shadow.bias=-.0005;key.shadow.normalBias=.02;
scene.add(key);scene.add(key.target);
const rim=new THREE.DirectionalLight(0xcfe6ff,1.4);rim.position.set(-4,4,-5);scene.add(rim);

/* ---------------- material helpers ---------------- */
const M=(color,o={})=>new THREE.MeshPhysicalMaterial(Object.assign({color,roughness:.6,metalness:0,envMapIntensity:.6},o));
const SKIN=M(0xF6C29E,{roughness:.5,sheen:.4,sheenColor:new THREE.Color(0xffd0b0),clearcoat:.08,clearcoatRoughness:.6});
const mesh=(g,m,cast=true)=>{const x=new THREE.Mesh(g,m);x.castShadow=cast;x.receiveShadow=true;return x;};
const sph=(r,m,seg=48)=>mesh(new THREE.SphereGeometry(r,seg,seg/1.5|0),m);
const cap=(r,l,m)=>mesh(new THREE.CapsuleGeometry(r,l,10,24),m);
const at=(o,x,y,z)=>{o.position.set(x,y,z);return o;};
const sc=(o,x,y,z)=>{o.scale.set(x,y,z);return o;};

/* ---------------- character factory ---------------- */
function makeHead(o){
  const head=new THREE.Group();
  const skull=sc(at(sph(.36,SKIN,64),0,.34,0),1,1.0,.95);head.add(skull);
  [-1,1].forEach(s=>{head.add(sc(at(sph(.075,SKIN),s*.345,.3,-.02),.6,1,1));});
  // eyes
  const eyes=new THREE.Group();eyes.position.set(0,.36,0);head.add(eyes);
  const white=M(0xffffff,{roughness:.15,clearcoat:1,clearcoatRoughness:.05});
  const irisM=M(o.iris,{roughness:.25,clearcoat:1});
  const black=M(0x111116,{roughness:.1,clearcoat:1});
  const glint=new THREE.MeshBasicMaterial({color:0xffffff});
  const eyeGroups=[];
  [-1,1].forEach(s=>{
    const e=new THREE.Group();e.position.set(s*.135,0,.235);eyes.add(e);
    e.add(sc(sph(.105,white),1,1.12,1));
    const ir=sc(at(sph(.066,irisM),0,-.005,.085),1,1.1,.45);e.add(ir);
    e.add(sc(at(sph(.036,black),0,-.005,.108),1,1.1,.3));
    e.add(at(sph(.017,glint,16),-.025,.03,.118));
    e.add(at(sph(.008,glint,12),.022,-.025,.116));
    eyeGroups.push(e);
  });
  // lids for blinking
  const lidM=SKIN;
  const lids=[-1,1].map(s=>{const l=sc(at(sph(.112,lidM),s*.135,.36,.235),1,1.15,1);l.visible=false;head.add(l);return l;});
  // brows
  const browM=M(o.brow,{roughness:.8});
  [-1,1].forEach(s=>{const b=cap(.018,.1,browM);b.rotation.z=Math.PI/2+s*.18;at(b,s*.14,.495,.305);head.add(b);});
  // nose & cheeks
  head.add(sc(at(sph(.04,SKIN),0,.27,.345),1,.85,1));
  const cheekM=M(0xff8a8a,{transparent:true,opacity:.38,roughness:.9,depthWrite:false});
  [-1,1].forEach(s=>{const c=sc(at(sph(.065,cheekM,24),s*.215,.235,.27),1,.6,.35);c.castShadow=false;head.add(c);});
  // mouth
  const mouth=new THREE.Group();mouth.position.set(0,.165,.31);head.add(mouth);
  // D-shaped cartoon smile: lower half-ellipsoid, teeth on top, tongue at bottom
  const halfG=new THREE.SphereGeometry(.075,40,20,0,Math.PI*2,Math.PI/2,Math.PI/2);
  const mIn=sc(mesh(halfG,M(0x6e1c22,{roughness:.6})),1,1,.5);mouth.add(mIn);
  const teeth=sc(at(mesh(new THREE.CylinderGeometry(.068,.06,.012,32),M(0xffffff,{roughness:.3})),0,-.006,.006),1,1,.45);mouth.add(teeth);
  const tongue=sc(at(sph(.045,M(0xE86D6D,{roughness:.6})),0,-.05,.018),1,.42,.4);mouth.add(tongue);
  const lip=sc(at(mesh(new THREE.TorusGeometry(.075,.008,8,40,Math.PI),M(0xd98a80,{roughness:.6})),0,0,0),1,1,.5);lip.rotation.z=Math.PI;mouth.add(lip);
  mouth.rotation.x=-.18;
  return {head,eyes,lids,mouth,eyeGroups};
}
function makeArm(side,sleeve,cuff){
  const sh=new THREE.Group();
  const up=cap(.058,.2,sleeve);up.position.y=-.12;sh.add(up);
  const el=new THREE.Group();el.position.y=-.25;sh.add(el);
  const fo=cap(.052,.17,sleeve);fo.position.y=-.1;el.add(fo);
  if(cuff){const c=mesh(new THREE.TorusGeometry(.05,.022,12,24),cuff);c.rotation.x=Math.PI/2;c.position.y=-.2;el.add(c);}
  const hand=sc(at(sph(.068,SKIN),0,-.255,0),1,1.08,.9);el.add(hand);
  const thumb=at(sph(.03,SKIN,16),-side*.055,-.23,.03);el.add(thumb);
  return {sh,el};
}
function makeBoy(){
  const root=new THREE.Group(), body=new THREE.Group();root.add(body);
  const robeM=M(0xF7F8FB,{roughness:.75,sheen:1,sheenColor:new THREE.Color(0xffffff),sheenRoughness:.6});
  const pts=[[0,.02],[.29,.02],[.3,.08],[.28,.35],[.25,.6],[.22,.82],[.2,.93],[.13,1.0],[0,1.01]].map(p=>new THREE.Vector2(p[0],p[1]));
  const robe=sc(mesh(new THREE.LatheGeometry(pts,64),robeM),1,1,.82);body.add(robe);
  // shoes
  const shoeM=M(0x2D3140,{roughness:.4,clearcoat:.5});
  const shoes=[-1,1].map(s=>{const g=sc(at(sph(.1,shoeM),s*.11,.045,.12),1,.6,1.35);body.add(g);return g;});
  // backpack
  const bagM=M(0x4F9BD0,{roughness:.55,sheen:.5});
  const bag=at(mesh(new RoundedBoxGeometry(.46,.5,.2,6,.08),bagM),0,.68,-.2);body.add(bag);
  body.add(at(mesh(new RoundedBoxGeometry(.32,.18,.08,4,.04),M(0x3E86BD,{roughness:.55})),0,.55,-.33));
  // straps
  const strapM=M(0x3E86BD,{roughness:.55});
  [-1,1].forEach(s=>{const st=cap(.03,.3,strapM);st.position.set(s*.12,.8,.19);st.rotation.z=-s*.08;st.rotation.x=.18;sc(st,1,1,.5);body.add(st);
    const top=mesh(new THREE.TorusGeometry(.07,.028,10,20,Math.PI),strapM);top.rotation.y=Math.PI/2;top.position.set(s*.13,.95,.06);body.add(top);});
  // collar, placket, buttons, pocket
  const col=mesh(new THREE.TorusGeometry(.09,.03,16,32),robeM);col.rotation.x=Math.PI/2;col.position.y=1.0;body.add(col);
  const btnM=M(0xD7DCE6,{roughness:.3,clearcoat:1});
  [.86,.78,.70].forEach(y=>body.add(at(sph(.014,btnM,12),0,y,.205-(.86-y)*.12)));
  body.add(at(mesh(new RoundedBoxGeometry(.09,.08,.01,2,.004),M(0xEEF0F5,{roughness:.8})),.08,.82,.19));
  // neck & head
  body.add(at(cap(.07,.06,SKIN),0,1.04,0));
  const H=makeHead({iris:0x6B3F22,brow:0x3B2419});
  H.head.position.y=1.06;body.add(H.head);
  const hairM=M(0x3A2318,{roughness:.55,sheen:.6,sheenColor:new THREE.Color(0x8a5a3a),clearcoat:.2});
  const capG=new THREE.SphereGeometry(.38,64,32,0,Math.PI*2,0,Math.PI*.42);
  const hcap=sc(at(mesh(capG,hairM),0,.36,-.01),1.02,1.02,.98);hcap.rotation.x=-.12;H.head.add(hcap);
  const back=sc(at(mesh(new THREE.SphereGeometry(.375,48,24,0,Math.PI*2,0,Math.PI*.6),hairM),0,.34,-.03),1.02,1,.97);back.rotation.x=-.75;H.head.add(back);
  [[-.2,.56,.2,.5],[-.09,.6,.25,.25],[.03,.61,.26,-.05],[.15,.59,.23,-.35],[.25,.53,.17,-.6]].forEach(q=>{
    const tf=sc(at(sph(.11,hairM,32),q[0],q[1],q[2]),1.1,.62,.85);tf.rotation.set(.5,0,q[3]);H.head.add(tf);});
  const swoop=sc(at(sph(.16,hairM,32),.02,.66,.16),1.6,.5,.9);swoop.rotation.set(.35,0,-.12);H.head.add(swoop);
  // arms
  const sl=M(0xF7F8FB,{roughness:.75,sheen:1,sheenColor:new THREE.Color(0xffffff)});
  const aL=makeArm(-1,sl),aR=makeArm(1,sl);
  aL.sh.position.set(-.2,.92,0);aR.sh.position.set(.2,.92,0);body.add(aL.sh,aR.sh);
  return {root,body,robe,H,aL,aR,shoes,kind:'boy'};
}
function makeGirl(){
  const root=new THREE.Group(), body=new THREE.Group();root.add(body);
  const swM=M(0xE0363D,{roughness:.9,sheen:1,sheenColor:new THREE.Color(0xff9a9a),sheenRoughness:.5});
  const pts=[[0,.5],[.255,.5],[.27,.55],[.255,.75],[.22,.9],[.13,.99],[0,1.0]].map(p=>new THREE.Vector2(p[0],p[1]));
  body.add(sc(mesh(new THREE.LatheGeometry(pts,64),swM),1,1,.82));
  const creamM=M(0xF1E3CC,{roughness:.9,sheen:.8});
  const hem=sc(at(mesh(new THREE.TorusGeometry(.262,.04,16,64),creamM),0,.52,0),1,1,.82);hem.rotation.x=Math.PI/2;body.add(hem);
  // legs
  const legM=M(0x5E6675,{roughness:.85,sheen:.4});
  const bootM=M(0xA45E33,{roughness:.55,clearcoat:.3});
  const legs=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.095,.52,0);
    g.add(at(cap(.062,.3,legM),0,-.2,0));
    const bt=at(mesh(new RoundedBoxGeometry(.15,.17,.24,5,.06),bootM),0,-.44,.03);g.add(bt);
    const cf=mesh(new THREE.TorusGeometry(.07,.025,10,24),creamM);cf.rotation.x=Math.PI/2;cf.position.y=-.35;g.add(cf);
    body.add(g);return g;});
  // scarf
  const scM=M(0xC92A32,{roughness:.95,sheen:1,sheenColor:new THREE.Color(0xff8a8a)});
  const sca=mesh(new THREE.TorusGeometry(.13,.06,16,40),scM);sca.rotation.x=Math.PI/2;sca.position.y=1.0;sc(sca,1,.9,1);body.add(sca);
  const tail=cap(.045,.2,scM);tail.position.set(.1,.85,.19);tail.rotation.z=.15;sc(tail,1.2,1,.6);body.add(tail);
  body.add(at(cap(.068,.06,SKIN),0,1.04,0));
  const H=makeHead({iris:0x3E86B0,brow:0xC09050});
  H.head.position.y=1.06;body.add(H.head);
  const hairM=M(0xF0C870,{roughness:.5,sheen:.8,sheenColor:new THREE.Color(0xfff0b0),clearcoat:.25});
  const hcap=sc(at(mesh(new THREE.SphereGeometry(.385,64,32,0,Math.PI*2,0,Math.PI*.45),hairM),0,.35,-.01),1.02,1.02,.98);hcap.rotation.x=.12;H.head.add(hcap);
  const back=sc(at(mesh(new THREE.SphereGeometry(.38,48,24,0,Math.PI*2,0,Math.PI*.62),hairM),0,.33,-.04),1.02,1,.97);back.rotation.x=-.8;H.head.add(back);
  // side-swept fringe
  const fr=sc(at(sph(.2,hairM,40),-.07,.57,.21),1.45,.42,.75);fr.rotation.z=.32;fr.rotation.x=.45;H.head.add(sc(at(sph(.12,hairM,32),.17,.56,.23),1.2,.5,.7));H.head.add(fr);
  // buns + scrunchies
  const scrM=M(0xD9343C,{roughness:.8,sheen:1});
  const buns=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.29,.69,-.03);
    g.add(sph(.15,hairM));
    const tr=mesh(new THREE.TorusGeometry(.1,.04,12,32),scrM);tr.position.set(-s*.06,-.07,0);tr.rotation.set(Math.PI/2,0,s*.7);g.add(tr);
    H.head.add(g);return g;});
  // side strands
  [-1,1].forEach(s=>{const st=cap(.035,.2,hairM);st.position.set(s*.33,.2,.08);st.rotation.z=s*.12;H.head.add(st);});
  const creamCuff=creamM;
  const aL=makeArm(-1,swM,creamCuff),aR=makeArm(1,swM,creamCuff);
  aL.sh.position.set(-.2,.9,0);aR.sh.position.set(.2,.9,0);body.add(aL.sh,aR.sh);
  return {root,body,H,aL,aR,legs,buns,kind:'girl'};
}
const boy=makeBoy(), girl=makeGirl();
scene.add(boy.root,girl.root);

/* pose: arm angles are {z: sideways raise (outward +), x: forward (+), elbow: bend forward (+)} */
function setArm(a,side,{z=.12,x=0,elbow=.15}={}){a.sh.rotation.set(-x,0,side*z);a.el.rotation.set(-elbow,0,0);}
function pose(c,o){
  const {x=0,z=0,ry=0,bob=0,tilt=0,nod=0,armL={},armR={},talk=false,t=0,blinkOff=0,legL=0,legR=0,look=0,squash=1,s=1}=o;
  c.root.position.set(x,0,z);c.root.rotation.y=ry;c.root.scale.setScalar(s);
  c.body.position.y=bob;c.body.scale.set(1/Math.sqrt(squash),squash,1/Math.sqrt(squash));
  c.H.head.rotation.set(nod,look,tilt);
  setArm(c.aL,-1,armL);setArm(c.aR,1,armR);
  const blink=((t+blinkOff)%3.3)<.12;
  c.H.lids.forEach(l=>l.visible=blink);c.H.eyeGroups.forEach(e=>e.visible=!blink);
  const m=talk?(.45+.75*Math.abs(Math.sin(t*13))):.75;
  c.H.mouth.scale.set(1,m,1);
  if(c.legs){c.legs[0].rotation.x=legL;c.legs[1].rotation.x=legR;
    c.buns[0].rotation.z=Math.sin(t*6)*.05;c.buns[1].rotation.z=-Math.sin(t*6)*.05;}
  if(c.shoes){c.shoes[0].position.z=.12+legL*.25;c.shoes[1].position.z=.12+legR*.25;c.robe.rotation.z=(legL)*.08;}
}
function walk(t,sp=1){const ph=t*7.2*sp;
  return {bob:Math.abs(Math.sin(ph))*.05,armL:{z:.12,x:Math.sin(ph)*.5,elbow:.3},armR:{z:.12,x:-Math.sin(ph)*.5,elbow:.3},legL:Math.sin(ph)*.45,legR:-Math.sin(ph)*.45,tilt:Math.sin(ph)*.04};}
const WAVE_L=t=>({z:2.5,x:.2,elbow:.5+Math.sin(t*12)*.35});
const WAVE_R=t=>({z:2.5,x:.2,elbow:.5+Math.sin(t*12)*.35});
const HOLD={z:-.05,x:.35,elbow:1.9};

/* ---------------- sets ---------------- */
const street=new THREE.Group(), classroom=new THREE.Group(), party=new THREE.Group();
scene.add(street,classroom,party);
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,c);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return {tex:t,ctx:x,canvas:c};}
// sky gradient background
const sky=canvasTex(16,512,(x)=>{const g=x.createLinearGradient(0,0,0,512);g.addColorStop(0,'#6EC6FF');g.addColorStop(.7,'#CDEBFF');g.addColorStop(1,'#E9F6FF');x.fillStyle=g;x.fillRect(0,0,16,512);});
// ground
const grass=mesh(new THREE.PlaneGeometry(60,30),M(0x74C965,{roughness:.95}),false);grass.rotation.x=-Math.PI/2;street.add(grass);
const walkway=mesh(new RoundedBoxGeometry(60,.06,2.2,2,.02),M(0xEADBC4,{roughness:.9}),false);walkway.position.set(0,.0,.3);street.add(walkway);
// scrolling world group (houses, trees, tiles)
const world=new THREE.Group();street.add(world);
const tileM=M(0xD7C5AA,{roughness:.9});
for(let i=-30;i<30;i++){const l=mesh(new THREE.BoxGeometry(.03,.065,2.2),tileM,false);l.position.set(i*.8,0,.3);world.add(l);}
const HC=[0xFFB4A2,0xA0D8EF,0xFFD98E,0xB9E4A8,0xD7C1F5], RC=[0xE2533B,0x5B7CDB,0xF2853B];
for(let i=-12;i<12;i++){
  const g=new THREE.Group();const h=1.4+((i*37+100)%7)*.12;
  const w=mesh(new RoundedBoxGeometry(1.5,h,1.2,4,.06),M(HC[(i+20)%5],{roughness:.8}));w.position.y=h/2;g.add(w);
  const roof=mesh(new THREE.ConeGeometry(1.15,.8,4),M(RC[(i+30)%3],{roughness:.7}));roof.rotation.y=Math.PI/4;roof.position.y=h+.4;sc(roof,1,1,.8);g.add(roof);
  const winM=M(0xffffff,{roughness:.2,emissive:0xbfe6ff,emissiveIntensity:.15});
  [-.35,.35].forEach(x=>{const wn=mesh(new RoundedBoxGeometry(.32,.32,.05,2,.03),winM);wn.position.set(x,h-.45,.61);g.add(wn);});
  const door=mesh(new RoundedBoxGeometry(.34,.55,.05,2,.05),M(0x8A5A3B,{roughness:.6}));door.position.set(0,.27,.61);g.add(door);
  g.position.set(i*2.1,0,-3.4);world.add(g);
  if(i%2===0){const tr=new THREE.Group();tr.add(at(cap(.07,.5,M(0x8A5A3B,{roughness:.8})),0,.35,0));
    tr.add(at(sph(.42,M(0x5DBB63,{roughness:.7})),0,1.0,0));tr.add(at(sph(.25,M(0x7ED36B,{roughness:.7})),-.18,1.15,.15));
    tr.position.set(i*2.1+1.05,0,-2.2);world.add(tr);}
}
// clouds
const clouds=[];const cloudM=M(0xffffff,{roughness:.9,emissive:0xffffff,emissiveIntensity:.25});
for(let i=0;i<5;i++){const g=new THREE.Group();[[0,0,.5],[.5,.15,.6],[1,0,.5],[.5,-.15,.45]].forEach(p=>g.add(at(sph(p[2],cloudM,24),p[0],p[1],0)));
  g.position.set(-6+i*3+rnd(),5.2+rnd()*1.2,-9);g.scale.setScalar(.7+rnd()*.4);street.add(g);clouds.push(g);}
// sun
const sunG=new THREE.Group();sunG.add(sph(.7,new THREE.MeshBasicMaterial({color:0xFFE066})));
const rays=new THREE.Group();for(let i=0;i<12;i++){const r=cap(.07,.25,new THREE.MeshBasicMaterial({color:0xFFC21A}));r.castShadow=false;r.position.set(Math.cos(i*Math.PI/6)*1.0,Math.sin(i*Math.PI/6)*1.0,0);r.rotation.z=i*Math.PI/6+Math.PI/2;rays.add(r);}
sunG.add(rays);sunG.position.set(1.7,6.5,-10);street.add(sunG);
// school
const school=new THREE.Group();
{const b=mesh(new RoundedBoxGeometry(3.4,2.3,1.6,5,.08),M(0xFF8A65,{roughness:.75}));b.position.y=1.15;school.add(b);
 const roof=mesh(new THREE.CylinderGeometry(0,2.1,1.0,4,1),M(0xE2533B,{roughness:.6}));roof.rotation.y=Math.PI/4;roof.position.y=2.8;sc(roof,1.25,1,.62);school.add(roof);
 const sign=canvasTex(512,128,(x)=>{x.fillStyle='#fff';x.beginPath();x.roundRect(4,4,504,120,40);x.fill();x.fillStyle='#E2533B';x.font='900 84px Cairo';x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillText('مدرستي',256,70);});
 const sp=mesh(new THREE.PlaneGeometry(1.4,.35),new THREE.MeshStandardMaterial({map:sign.tex,transparent:true,roughness:.5}));sp.position.set(0,2.42,1.7);school.add(sp);school.userData.sign=sign;
 const winM=M(0xBFE6FF,{roughness:.15,clearcoat:1});
 [[-1.15,1.45],[1.15,1.45],[-1.15,.6],[1.15,.6]].forEach(p=>{const w=mesh(new RoundedBoxGeometry(.6,.55,.06,2,.04),winM);w.position.set(p[0],p[1],.81);school.add(w);
   const f=mesh(new RoundedBoxGeometry(.7,.65,.04,2,.05),M(0xffffff,{roughness:.6}));f.position.set(p[0],p[1],.79);school.add(f);});
 const door=mesh(new RoundedBoxGeometry(.8,1.1,.08,3,.08),M(0x7A4B2E,{roughness:.6}));door.position.set(0,.55,.82);school.add(door);
 const clk=new THREE.Group();clk.add(mesh(new THREE.CylinderGeometry(.24,.24,.05,32),M(0xffffff,{roughness:.3})));
 const ring=mesh(new THREE.TorusGeometry(.24,.035,10,32),M(0xE2533B));ring.rotation.x=Math.PI/2;clk.add(ring);
 const hand=mesh(new THREE.BoxGeometry(.025,.025,.17),M(0x333A56));hand.position.set(0,.04,-.06);const hp=new THREE.Group();hp.add(hand);clk.add(hp);
 clk.rotation.x=Math.PI/2;clk.position.set(0,1.45,.82);school.add(clk);school.userData.hand=hp;
 [-1.9,1.9].forEach(x=>school.add(at(sc(sph(.35,M(0x5DBB63,{roughness:.7})),1.3,.8,1),x,.25,.9)));
}
school.position.set(-12,0,-2.8);street.add(school);

// classroom
const wall=mesh(new THREE.PlaneGeometry(14,8),M(0xFFEBD0,{roughness:.95}),false);wall.position.set(0,3,-2.4);classroom.add(wall);
const floor=mesh(new THREE.PlaneGeometry(14,10),M(0xC98B52,{roughness:.6,clearcoat:.3}),false);floor.rotation.x=-Math.PI/2;classroom.add(floor);
for(let i=-8;i<8;i++){const l=mesh(new THREE.BoxGeometry(.02,.005,10),M(0xA8723F),false);l.position.set(i*.7,.003,0);classroom.add(l);}
const board=canvasTex(1024,560,()=>{});
function drawBoard(a,n,star){const x=board.ctx;const g=x.createRadialGradient(400,200,50,512,280,700);g.addColorStop(0,'#41805F');g.addColorStop(1,'#2A5A42');x.fillStyle=g;x.fillRect(0,0,1024,560);
  x.textAlign='center';x.textBaseline='middle';x.direction='rtl';x.fillStyle='#F7F3E8';x.font='900 170px Cairo';x.fillText(a,512,170);
  x.direction='ltr';x.fillStyle='#FFE38A';x.font='900 140px Cairo';x.fillText(n,512,400);
  if(star){x.fillStyle='#FFE38A';x.font='90px sans-serif';x.fillText('★',90,90);} board.tex.needsUpdate=true;}
const bframe=mesh(new RoundedBoxGeometry(3.1,1.8,.12,4,.05),M(0x9C6B3E,{roughness:.6}));bframe.position.set(0,2.95,-2.32);classroom.add(bframe);
const bface=mesh(new THREE.PlaneGeometry(2.86,1.56),new THREE.MeshStandardMaterial({map:board.tex,roughness:.85}),false);bface.position.set(0,2.95,-2.25);classroom.add(bface);
const ledge=mesh(new RoundedBoxGeometry(2.6,.06,.14,2,.02),M(0x7A5230));ledge.position.set(0,2.02,-2.22);classroom.add(ledge);
const FC=[0xFF6B6B,0xFFD43B,0x4DABF7,0x69DB7C,0xB197FC];
for(let i=0;i<11;i++){const x=-3+i*.6,y=4.5-Math.sin(Math.PI*i/10)*.35;const f=mesh(new THREE.ConeGeometry(.16,.4,3),M(FC[i%5],{roughness:.7}));f.rotation.x=Math.PI;f.position.set(x,y,-2.3);classroom.add(f);}
// desks
function desk(x,z){const g=new THREE.Group();const top=mesh(new RoundedBoxGeometry(1.0,.07,.6,3,.03),M(0xE9B872,{roughness:.5,clearcoat:.4}));top.position.y=.62;g.add(top);
  [[-.42,-.24],[.42,-.24],[-.42,.24],[.42,.24]].forEach(p=>g.add(at(mesh(new THREE.CylinderGeometry(.03,.03,.6,12),M(0x5B7CDB,{metalness:.3,roughness:.4})),p[0],.3,p[1])));
  const book=mesh(new RoundedBoxGeometry(.3,.05,.22,2,.01),M(0x69DB7C));book.position.set(.15,.68,0);book.rotation.y=.3;g.add(book);
  const ap=at(sph(.07,M(0xE8333B,{roughness:.3,clearcoat:1})),-.25,.72,0);g.add(ap);
  g.position.set(x,0,z);classroom.add(g);}
desk(-1.85,-1.2);desk(1.85,-1.2);

// party
const burstT=canvasTex(1024,1024,(x)=>{x.fillStyle='#FFD96A';x.fillRect(0,0,1024,1024);x.translate(512,512);x.fillStyle='#FFC93C';for(let i=0;i<24;i++){x.beginPath();x.moveTo(0,0);x.arc(0,0,800,i*Math.PI/12,(i+.5)*Math.PI/12);x.fill();}});
const burst=mesh(new THREE.PlaneGeometry(16,16),new THREE.MeshBasicMaterial({map:burstT.tex}),false);burst.position.set(0,2.4,-5);burst.scale.setScalar(1.4);party.add(burst);
const pfloor=mesh(new THREE.PlaneGeometry(30,20),M(0xFFE9A8,{roughness:.8}),false);pfloor.rotation.x=-Math.PI/2;pfloor.position.y=.001;party.add(pfloor);
const confG=new THREE.PlaneGeometry(.07,.11);const conf=[];
for(let i=0;i<120;i++){const m=new THREE.Mesh(confG,new THREE.MeshStandardMaterial({color:FC[i%5],side:THREE.DoubleSide,roughness:.5}));
  conf.push({m,x:(rnd()-.5)*4,z:(rnd()-.5)*2+.5,d:rnd()*1.2,v:1.2+rnd()*1.2,sw:rnd()*6.28,r:rnd()*6});party.add(m);}
// stars burst (3D)
const starShape=new THREE.Shape();for(let i=0;i<10;i++){const r=i%2?.045:.11,a=i*Math.PI/5-Math.PI/2;i?starShape.lineTo(Math.cos(a)*r,Math.sin(a)*r):starShape.moveTo(Math.cos(a)*r,Math.sin(a)*r);}
const starG=new THREE.ExtrudeGeometry(starShape,{depth:.04,bevelEnabled:true,bevelSize:.015,bevelThickness:.015,bevelSegments:3});
const stars=[];for(let i=0;i<10;i++){const s=new THREE.Mesh(starG,M(FC[i%5],{roughness:.3,clearcoat:1}));s.visible=false;scene.add(s);stars.push({s,a:i*36+rnd()*20,r:.6+rnd()*.4});}
function starsAt(t,a,cx,cy,cz){const lt=t-a;stars.forEach((st,i)=>{const p=P(lt,i*.05,.9+i*.05);st.s.visible=lt>0&&p<1;
  const r=eOut(p)*st.r;st.s.position.set(cx+Math.cos(st.a*Math.PI/180)*r,cy+Math.sin(st.a*Math.PI/180)*r,cz);
  st.s.scale.setScalar(Math.sin(p*Math.PI)*1.3+.001);st.s.rotation.z=p*3;st.s.rotation.y=p*4;});}

/* ---------------- overlays ---------------- */
const v=new THREE.Vector3();
function screenOf(c,yOff=1.95){v.set(0,yOff,0);c.root.localToWorld(v);v.project(camera);return {x:(v.x+1)/2*540,y:(1-v.y)/2*960};}
function bubble(id,t,a,b,c){const el=$(id);const vis=t>=a&&t<b;el.style.display=vis?'block':'none';if(!vis)return;
  const p=P(t,a,a+.35),q=P(t,b-.2,b);const pos=screenOf(c);const w=el.offsetWidth;
  el.style.left=clamp(pos.x-w/2,12,540-12-w)+'px';el.style.top=(pos.y-70)+'px';
  el.style.transform=`scale(${eBack(p)*(1-eIn(q))}) translateY(${Math.sin(t*3)*3}px)`;}
function titlePop(id,t,a,b){const el=$(id);const vis=t>=a&&(!b||t<b);el.style.display=vis?'block':'none';if(!vis)return;
  const p=P(t,a,a+.5),q=b?P(t,b-.3,b):0;el.style.transform=`scale(${eBack(p)*(1-eIn(q))}) rotate(${Math.sin(t*2.5)*2}deg)`;}

/* ---------------- render ---------------- */
function render(t){
  ['bub1','bub2','bub3','bub4','bub5','t1','t3','t5','t5b'].forEach(i=>$(i).style.display='none');
  stars.forEach(s=>s.s.visible=false);
  const sceneId=t<S[2]?'street':t<S[3]?'class':'party';
  street.visible=sceneId==='street';classroom.visible=sceneId==='class';party.visible=sceneId==='party';
  scene.background=sceneId==='street'?sky.tex:sceneId==='class'?new THREE.Color(0xFFE6C7):new THREE.Color(0xFFD96A);
  sunG.rotation.z=0;rays.rotation.z=t*.4;
  clouds.forEach((c,i)=>{c.position.x=((-6+i*3+t*.25)%15+15)%15-7.5;});

  if(t<S[1]){ /* ---- A: meet on street ---- */
    camera.position.set(lerp(.4,0,eOut(P(t,0,4))),2.0,lerp(9.6,8.8,eIO(P(t,0,10))));camera.lookAt(0,2.0,0);
    world.position.x=0;school.position.x=-12;
    titlePop('t1',t,.3,4.2);
    const bx=t<3?lerp(3.2,.65,eOut(P(t,.5,3.0))):t<5.2?.65:lerp(.65,.62,P(t,5.2,6));
    let bp={x:bx,t,armR:HOLD,ry:0};
    if(t<3.0){Object.assign(bp,walk(t));bp.armR=HOLD;bp.ry=lerp(-1.1,0,eIO(P(t,2.4,3.1)));}
    if(t>3.0&&t<4.6){bp.armL=WAVE_L(t);bp.tilt=Math.sin(t*4)*.06;bp.talk=t>3.2&&t<4.4;}
    if(t>5.4&&t<8.3){bp.ry=-.35;bp.look=-.15;}
    if(t>8.3&&t<9.8){bp.talk=t<9.4;bp.bob=t<9.4?Math.abs(Math.sin((t-8.3)*6))*.18:0;bp.armL={z:.6,x:.3,elbow:1.2};bp.ry=-.25;}
    pose(boy,bp);
    const gx=t<5?-4:lerp(-3.2,-.62,eOut(P(t,5,6.9)));
    let gp={x:gx,t,blinkOff:1.4,ry:0};
    if(t>=5&&t<6.9){Object.assign(gp,walk(t,1.05));gp.ry=lerp(1.1,.35,eIO(P(t,6.3,6.9)));}
    if(t>=6.9){gp.ry=.35;gp.look=.15;}
    if(t>=6.9&&t<8.3){gp.armR=WAVE_R(t);gp.talk=t>7.0&&t<8.1;gp.tilt=Math.sin(t*4)*.06;}
    pose(girl,gp);
    bubble('bub1',t,3.2,4.8,boy);bubble('bub2',t,7.0,8.4,girl);bubble('bub3',t,8.4,9.9,boy);
  }
  else if(t<S[2]){ /* ---- B: walk to school ---- */
    const lt=t-S[1], stopAt=4.0;
    const sp=eOut(P(lt,0,stopAt));
    world.position.x=sp*6.5;
    school.position.x=lerp(-9,0,sp)+0; school.userData.hand.rotation.z=-lt*2;
    camera.position.set(lerp(1.0,0,eIO(P(lt,0,stopAt))),2.0,9.2);camera.lookAt(0,2.0,0);
    titlePop('t3',t,S[1]+.4,S[2]-.3);
    let bp={x:.55,t,armR:HOLD}, gp={x:-.55,t,blinkOff:1.4,z:.15};
    if(lt<stopAt){const k=1-P(lt,stopAt-.8,stopAt)*.0;
      Object.assign(bp,walk(t));bp.armR=HOLD;bp.ry=lerp(-1.1,0,eIO(P(lt,stopAt-.4,stopAt+.1)));
      Object.assign(gp,walk(t+.2));gp.ry=bp.ry;}
    else{
      const j=P(lt,stopAt+.2,stopAt+.8), j2=P(lt,stopAt+.35,stopAt+.95);
      bp.bob=Math.sin(j*Math.PI)*.35;gp.bob=Math.sin(j2*Math.PI)*.35;
      bp.armL={z:2.6,x:.1,elbow:.3};gp.armR={z:2.6,x:.1,elbow:.3};
      if(lt>stopAt+.2) starsAt(t,S[1]+stopAt+.2,0,1.8,.2);
    }
    pose(boy,bp);pose(girl,gp);
  }
  else if(t<S[3]){ /* ---- C: classroom ---- */
    const lt=t-S[2];
    camera.position.set(lerp(-.4,.3,eIO(P(lt,0,5.5))),2.0,8.6);camera.lookAt(0,2.0,0);
    const A='أ ب ت ث', N='1 2 3';
    const na=Math.floor(clamp((lt-.4)/1.6)*A.length), nn=Math.floor(clamp((lt-1.9)/1.0)*N.length);
    const key=na+'|'+nn+'|'+(lt>2.9);if(board.last!==key){board.last=key;drawBoard(A.slice(0,na),N.slice(0,nn),lt>2.9);}
    let gp={x:-.62,t,blinkOff:1.4,ry:.15}, bp={x:.62,t,armR:HOLD,ry:-.15};
    gp.bob=(1-eOut(P(lt,0,.6)))*2.5; bp.bob=(1-eOut(P(lt,.15,.75)))*2.5;
    if(lt>.9&&lt<2.4){gp.talk=lt<2.2;gp.armR={z:1.2,x:.4,elbow:1.0+Math.sin(lt*10)*.2};gp.tilt=Math.sin(lt*4)*.06;}
    if(lt>2.6){bp.armL={z:2.3,x:.35,elbow:.35+Math.sin(lt*14)*.15};bp.bob=Math.abs(Math.sin(lt*7))*.05;bp.talk=lt>2.7&&lt<4.0;bp.tilt=-.08;gp.look=.3;gp.ry=.4;}
    pose(girl,gp);pose(boy,bp);
    bubble('bub4',t,S[2]+.9,S[2]+2.5,girl);bubble('bub5',t,S[2]+2.7,S[2]+4.3,boy);
    if(lt>3.6) starsAt(t,S[2]+3.6,.62,2.3,.3);
  }
  else { /* ---- D: celebration ---- */
    const lt=t-S[3];
    camera.position.set(Math.sin(lt*.6)*.6,2.0,lerp(9.6,8.8,eOut(P(lt,0,4))));camera.lookAt(0,2.0,0);
    burst.rotation.z=lt*.25;
    titlePop('t5',t,S[3]+.3);titlePop('t5b',t,S[3]+.9);
    const jb=lt>.5?Math.abs(Math.sin(lt*5.2))*.45:0, jg=lt>.6?Math.abs(Math.sin(lt*5.2+1.4))*.45:0;
    const sqb=1-.1*Math.max(0,1-jb/.08), sqg=1-.1*Math.max(0,1-jg/.08);
    const up={z:2.7,x:.15,elbow:.25};
    pose(boy,{x:.62,t,bob:jb,squash:sqb,armL:up,armR:up,ry:-.15});
    pose(girl,{x:-.62,t,bob:jg,squash:sqg,armL:up,armR:up,blinkOff:1.4,legL:.25,legR:-.25,ry:.15});
    conf.forEach(c=>{const l2=lt-c.d;c.m.visible=l2>0;if(l2<=0)return;
      c.m.position.set(c.x+Math.sin(l2*3+c.sw)*.2,4.2-l2*c.v,c.z);c.m.rotation.set(l2*4+c.r,l2*3,l2*2);});
  }
  // iris
  const ir=$('iris');ir.style.display='none';
  for(const b of [S[1],S[2],S[3]]){if(t>b-.45&&t<b+.45){ir.style.display='block';
    $('irc').setAttribute('r',t<b?lerp(620,0,eIn(P(t,b-.45,b))):lerp(0,620,eOut(P(t,b,b+.45))));}}
  document.body.style.opacity=Math.min(1,t/.25)*Math.min(1,(DURATION-t)/.5);
  renderer.render(scene,camera);
}
window.render=render;window.DURATION=DURATION;
Promise.all([document.fonts.load('900 80px Cairo'),document.fonts.ready]).then(()=>{
  // redraw canvas textures now that the font is ready
  const s=school.userData.sign;s.ctx.clearRect(0,0,512,128);s.ctx.fillStyle='#fff';s.ctx.beginPath();s.ctx.roundRect(4,4,504,120,40);s.ctx.fill();
  s.ctx.fillStyle='#E2533B';s.ctx.font='900 84px Cairo';s.ctx.textAlign='center';s.ctx.textBaseline='middle';s.ctx.direction='rtl';s.ctx.fillText('مدرستي',256,70);s.tex.needsUpdate=true;
  drawBoard('','',false);
  render(0);window.READY=true;});
if(!navigator.webdriver){const t0=performance.now();(function loop(){if(window.READY)render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();}
</script>
</body>
