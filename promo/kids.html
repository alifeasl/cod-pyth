.bub.tl:after{left:30px}.bub.tr:after{right:30px}

const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const P=(t,a,b)=>clamp((t-a)/(b-a));
const eOut=x=>1-Math.pow(1-x,3), eIn=x=>x*x*x, eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eBack=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2);};
const lerp=(a,b,x)=>a+(b-a)*x;
let seed=5;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647;};

const SC=1.0; // character scale
function pose(p,o){
  const {x,y=880,s=SC,bob=0,tilt=0,armL=[12,-6],armR=[-12,6],talk=0,t=0,blinkOff=0,legL=0,legR=0,flipLook=0,squash=1}=o;
  const el=$(p==='b'?'boy':'girl');
  el.style.left=(x-100)+'px'; el.style.top=(y-420)+'px';
  el.style.width='200px';el.style.height='420px';el.style.transformOrigin='100px 420px';
  el.style.transform=`translateY(${-bob}px) scale(${s},${s*squash})`;
  $(p+'_head').setAttribute('transform',`rotate(${tilt} 100 170)`);
  $(p+'_upL').setAttribute('transform',`rotate(${armL[0]})`); $(p+'_foL').setAttribute('transform',`translate(0 50) rotate(${armL[1]})`);
  $(p+'_upR').setAttribute('transform',`rotate(${armR[0]})`); $(p+'_foR').setAttribute('transform',`translate(0 50) rotate(${armR[1]})`);
  const bl=((t+blinkOff)%3.3)<.13?.12:1;
  $(p+'_eyes').setAttribute('transform',`translate(0 112) scale(1 ${bl}) translate(${flipLook} -112)`);
  const m=talk?(.45+.55*Math.abs(Math.sin(t*14))):1;
  $(p+'_mouth').setAttribute('transform',`translate(100 146) scale(1 ${m})`);
  if(p==='g'){ $('g_legL').setAttribute('transform',`translate(84 292) rotate(${legL})`); $('g_legR').setAttribute('transform',`translate(116 292) rotate(${legR})`);
    $('g_bunL').setAttribute('transform',`rotate(${Math.sin(t*6)*2} 46 60)`);$('g_bunR').setAttribute('transform',`rotate(${-Math.sin(t*6)*2} 154 60)`);}
  else { $('b_shoeL').setAttribute('transform',`translate(${legL*.4} 0)`);$('b_shoeR').setAttribute('transform',`translate(${legR*.4} 0)`); }
}
function walk(t,speed=1){ // returns pose pieces for walking
  const ph=t*7.5*speed;
  return {bob:Math.abs(Math.sin(ph))*12, armL:[12+Math.sin(ph)*22,-10], armR:[-12+Math.sin(ph)*22,10], legL:Math.sin(ph)*16, legR:-Math.sin(ph)*16, tilt:Math.sin(ph)*3};
}
const WAVE=t=>[150,Math.sin(t*12)*28];
const WAVER=t=>[-150,-Math.sin(t*12)*28];
const HOLD=[-10,120]; // boy holding strap (right arm, inward)

/* ================= DECOR ================= */
for(let i=0;i<12;i++){const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',-4);r.setAttribute('y',-66);r.setAttribute('width',8);r.setAttribute('height',16);r.setAttribute('rx',4);r.setAttribute('fill','#FFC21A');r.setAttribute('transform',`rotate(${i*30})`);$('sunRays').appendChild(r);}
const clouds=[];for(let i=0;i<4;i++){const c=document.createElement('div');c.className='abs';
  c.innerHTML=`<svg width="150" height="70" viewBox="0 0 150 70"><g fill="#fff"><circle cx="40" cy="44" r="24"/><circle cx="72" cy="32" r="30"/><circle cx="106" cy="44" r="24"/><rect x="40" y="44" width="66" height="24" rx="12"/></g></svg>`;
  $('clouds').appendChild(c);clouds.push({el:c,x:rnd()*600-60,y:110+i*70+rnd()*30,v:6+rnd()*10,s:.6+rnd()*.5});}
// town houses (repeat for parallax)
const HC=['#FFB4A2','#A0D8EF','#FFD98E','#B9E4A8','#D7C1F5'];
let townHTML='';for(let i=0;i<10;i++){const x=i*150-150,h=150+(i*37)%70,c=HC[i%5];
  townHTML+=`<svg class="abs" style="left:${x}px;top:${700-h-40}px" width="140" height="${h+40}" viewBox="0 0 140 ${h+40}">
   <path d="M5 50 L70 5 L135 50Z" fill="${['#E2533B','#5B7CDB','#F2853B'][i%3]}"/><rect x="15" y="48" width="110" height="${h-8}" fill="${c}"/>
   <rect x="32" y="70" width="28" height="28" rx="4" fill="#fff" opacity=".85"/><rect x="80" y="70" width="28" height="28" rx="4" fill="#fff" opacity=".85"/>
   <rect x="56" y="${h-10}" width="28" height="${50}" rx="8" fill="#8A5A3B"/></svg>`;
  if(i%2) townHTML+=`<svg class="abs" style="left:${x+120}px;top:600px" width="70" height="110" viewBox="0 0 70 110"><rect x="30" y="60" width="10" height="50" fill="#8A5A3B"/><circle cx="35" cy="45" r="32" fill="#5DBB63"/><circle cx="24" cy="36" r="12" fill="#7ED36B"/></svg>`;}
$('town').innerHTML=townHTML;
// flags
const FC=['#FF6B6B','#FFD43B','#4DABF7','#69DB7C','#B197FC'];
let fl='';for(let i=0;i<9;i++){const x=30+i*60,y=10+50*Math.sin(Math.PI*x/540)*0.75;fl+=`<path d="M${x-14} ${y} L${x+14} ${y} L${x} ${y+30}Z" fill="${FC[i%5]}"/>`;}
$('flags').innerHTML=fl;
// burst
let bg='';for(let i=0;i<24;i++){bg+=`<path d="M0 0 L${700*Math.cos(i*Math.PI/12)} ${700*Math.sin(i*Math.PI/12)} L${700*Math.cos((i+.5)*Math.PI/12)} ${700*Math.sin((i+.5)*Math.PI/12)}Z" fill="#FFC93C"/>`;}
$('burstG').innerHTML=bg;
// confetti
const conf=[];for(let i=0;i<70;i++){const d=document.createElement('div');d.className='abs';
  d.style.cssText=`width:${8+rnd()*8}px;height:${12+rnd()*10}px;border-radius:3px;background:${FC[i%5]}`;
  $('confetti').appendChild(d);conf.push({el:d,x:rnd()*540,d:rnd()*1.2,v:180+rnd()*200,sw:rnd()*6.28,r:rnd()*720});}
// sparkle stars fx
const stars=[];for(let i=0;i<10;i++){const d=document.createElement('div');d.className='abs';d.textContent='★';
  d.style.cssText=`font-size:${26+rnd()*20}px;color:${FC[i%5]};text-shadow:0 2px 0 rgba(0,0,0,.1)`;$('fx').appendChild(d);
  stars.push({el:d,a:i*36+rnd()*20,r:110+rnd()*60});}

function bubble(id,t,a,b,x,y){
  const el=$(id); const p=P(t,a,a+.35), q=P(t,b-.2,b);
  el.style.display=(t>=a&&t<b)?'block':'none';
  el.style.left=x+'px';el.style.top=y+'px';
  el.style.transform=`scale(${eBack(p)*(1-eIn(q))}) translateY(${Math.sin(t*3)*3}px)`;
}
function titlePop(id,t,a,b){const el=$(id);const p=P(t,a,a+.5),q=b?P(t,b-.3,b):0;
  el.style.display=(t>=a&&(!b||t<b))?'block':'none';
  el.style.transform=`scale(${eBack(p)*(1-eIn(q))}) rotate(${Math.sin(t*2.5)*2}deg)`;}
function starsAt(t,a,cx,cy){const lt=t-a;
  stars.forEach((s,i)=>{const p=P(lt,i*.05,.9+i*.05);const vis=lt>0&&p<1;
    s.el.style.display=vis?'block':'none';
    const r=eOut(p)*s.r;s.el.style.left=(cx+Math.cos(s.a*Math.PI/180)*r-15)+'px';s.el.style.top=(cy+Math.sin(s.a*Math.PI/180)*r-15)+'px';
    s.el.style.transform=`scale(${Math.sin(p*Math.PI)*1.2}) rotate(${p*180}deg)`;});}

function render(t){
  const sc=t<S[1]||(t>=S[1]&&t<S[2])?'street':t<S[3]?'classroom':'party';
  $('street').style.display=sc==='street'?'block':'none';
  $('classroom').style.display=sc==='classroom'?'block':'none';
  $('party').style.display=sc==='party'?'block':'none';
  $('school').style.display='none';
  ['t1','t3','t5','t5b'].forEach(i=>$(i).style.display='none');
  stars.forEach(s=>s.el.style.display='none');
  conf.forEach(c=>c.el.style.display='none');
  ['bub1','bub2','bub3','bub4','bub5'].forEach(i=>$(i).style.display='none');

  // ambient
  $('sun').style.transform=`translateY(${Math.sin(t*1.2)*5}px)`; $('sunRays').setAttribute('transform',`rotate(${t*20})`);
  clouds.forEach(c=>{c.el.style.left=(((c.x+t*c.v)%700)-120)+'px';c.el.style.top=c.y+'px';c.el.style.transform=`scale(${c.s})`;});

  let scroll=0;
  /* ---------- SCENE A : street meet (0-10) ---------- */
  if(t<S[1]){
    $('town').style.transform='';$('tiles').style.transform='';
    titlePop('t1',t,.3,4.2);
    // boy walks in from right
    const bx = t<3 ? lerp(680,340,eOut(P(t,.6,3.0))) : t<5.2 ? 340 : lerp(340,385,eIO(P(t,5.2,6.2)));
    let bp={x:bx,t,blinkOff:0,armR:HOLD};
    if(t<3.0){Object.assign(bp,walk(t));bp.armR=HOLD;}
    if(t>3.0&&t<4.6){bp.armL=WAVE(t);bp.tilt=Math.sin(t*4)*4;bp.talk=t>3.2&&t<4.4;}
    if(t>8.3&&t<9.8){bp.talk=t<9.4;bp.bob=Math.abs(Math.sin((t-8.3)*6))*18*(t<9.4?1:0);bp.armL=[40,-60];}
    if(t>5.6&&t<8.3){bp.flipLook=-5;bp.tilt=-4;}
    pose('b',bp);
    bubble('bub1',t,3.2,4.8,bx-70,385);
    // girl walks in from left
    const gx = t<5 ? -200 : lerp(-160,150,eOut(P(t,5,6.9)));
    let gp={x:gx,t,blinkOff:1.4};
    if(t>=5&&t<6.9) Object.assign(gp,walk(t,1.05));
    if(t>=6.9&&t<8.3){gp.armR=WAVER(t);gp.talk=t>7.0&&t<8.1;gp.tilt=Math.sin(t*4)*4;gp.flipLook=5;}
    if(t>=8.3){gp.flipLook=5;gp.tilt=5;}
    pose('g',gp);
    bubble('bub2',t,7.0,8.4,Math.max(12,gx-90),385);
    bubble('bub3',t,8.4,9.9,bx-120,385);
  }
  /* ---------- SCENE B : walking to school (10-15.5) ---------- */
  else if(t<S[2]){
    const lt=t-S[1];
    // walk in place with parallax until school arrives
    const stopAt=4.0;
    const prog = lt<stopAt ? lt : stopAt + 0;
    const sp = 110;
    scroll = Math.min(lt,stopAt)*sp - (lt<stopAt?0:0);
    // ease out the scroll near stop
    const sEase = stopAt*sp*eOut(P(lt,0,stopAt))*0.9 + Math.min(lt,stopAt)*sp*0.1;
    $('town').style.transform=`translateX(${(sEase*.6)%300}px)`;
    $('tiles').style.transform=`translateX(${sEase%72}px)`;
    $('school').style.display='block';
    $('school').style.left=(lerp(-600,60,eOut(P(lt,0,stopAt))))+'px';
    titlePop('t3',t,S[1]+.4,S[2]-.3);
    const walking=lt<stopAt;
    let bp={x:375,t,blinkOff:0,armR:HOLD}, gp={x:165,t,blinkOff:1.4};
    if(walking){Object.assign(bp,walk(t));bp.armR=HOLD;Object.assign(gp,walk(t+.2));}
    else{ // arrive: both look at school, jump once
      const j=P(lt,stopAt+.2,stopAt+.8); const jb=Math.sin(j*Math.PI)*40;
      bp.bob=jb; gp.bob=Math.sin(P(lt,stopAt+.35,stopAt+.95)*Math.PI)*40;
      bp.armL=[150,-20]; gp.armR=[-150,20]; bp.flipLook=-4; gp.flipLook=-4;
      bp.talk=0;
    }
    pose('b',bp);pose('g',gp);
    // bell wiggle
    $('schBell').setAttribute('transform',`rotate(${lt*120} 210 215)`);
    if(lt>stopAt+.2) starsAt(t,S[1]+stopAt+.2,240,560);
  }
  /* ---------- SCENE C : classroom (15.5-21) ---------- */
  else if(t<S[3]){
    const lt=t-S[2];
    const A='أ ب ت ث', N='1 2 3';
    const na=Math.floor(clamp((lt-.4)/1.6)*A.length); $('boardA').textContent=A.slice(0,na);
    const nn=Math.floor(clamp((lt-1.9)/1.0)*N.length); $('boardN').textContent=N.slice(0,nn);
    $('chalkStar').style.transform=`scale(${eBack(P(lt,2.9,3.3))}) rotate(${lt*40}deg)`;
    $('clkM').setAttribute('transform',`rotate(${lt*60})`);
    const gIn=eOut(P(lt,0,.6));
    let gp={x:150,y:905,t,blinkOff:1.4,s:SC*1.02}, bp={x:390,y:905,t,blinkOff:0,armR:HOLD,s:SC*1.02};
    gp.bob=(1-gIn)*-200; bp.bob=(1-eOut(P(lt,.15,.75)))*-200;
    if(lt>.9&&lt<2.4){gp.talk=lt<2.2;gp.armR=[-140,-30+Math.sin(lt*10)*10];gp.tilt=Math.sin(lt*4)*4;}
    if(lt>2.6){bp.armL=[138,28+Math.sin(lt*14)*8];bp.bob=Math.abs(Math.sin(lt*7))*10;bp.talk=lt>2.7&&lt<4.0;bp.tilt=-5;}
    if(lt>2.6){gp.flipLook=5;gp.tilt=5;}
    pose('g',gp);pose('b',bp);
    bubble('bub4',t,S[2]+.9,S[2]+2.5,40,425);
    bubble('bub5',t,S[2]+2.7,S[2]+4.3,230,425);
    if(lt>3.6) starsAt(t,S[2]+3.6,390,600);
  }
  /* ---------- SCENE D : celebration (21-25.5) ---------- */
  else {
    const lt=t-S[3];
    $('burstG').setAttribute('transform',`rotate(${lt*15})`);
    titlePop('t5',t,S[3]+.3); titlePop('t5b',t,S[3]+.9);
    const jb=Math.abs(Math.sin(lt*5.2))*60, jg=Math.abs(Math.sin(lt*5.2+1.4))*60;
    const sqb=1-0.08*Math.max(0,1-jb/12), sqg=1-0.08*Math.max(0,1-jg/12);
    pose('b',{x:375,y:880,t,s:SC*1.05,bob:lt>.5?jb:0,squash:sqb,armL:[160,-10],armR:[-160,10],blinkOff:0});
    pose('g',{x:165,y:880,t,s:SC*1.05,bob:lt>.6?jg:0,squash:sqg,armL:[160,-10],armR:[-160,10],blinkOff:1.4,legL:-10,legR:10});
    conf.forEach(c=>{const lt2=lt-c.d; if(lt2<0)return; c.el.style.display='block';
      c.el.style.left=(c.x+Math.sin(lt2*3+c.sw)*30)+'px'; c.el.style.top=(-30+lt2*c.v)+'px';
      c.el.style.transform=`rotate(${c.r+lt2*300}deg) scaleX(${Math.cos(lt2*8+c.sw)})`;});
  }

  /* ---------- iris transitions ---------- */
  const ir=$('iris'); ir.style.display='none';
  for(const b of [S[1],S[2],S[3]]){
    if(t>b-.45&&t<b+.45){ir.style.display='block';
      const r = t<b ? lerp(620,0,eIn(P(t,b-.45,b))) : lerp(0,620,eOut(P(t,b,b+.45)));
      $('irc').setAttribute('r',r);}
  }
  // the scene-A -> B boundary keeps same street but we still iris for rhythm
  $('stage').style.opacity=Math.min(1,t/.25)*Math.min(1,(DURATION-t)/.5);
}
window.render=render;window.DURATION=DURATION;
document.fonts.ready.then(()=>{window.READY=true;});
if(!navigator.webdriver){const t0=performance.now();(function loop(){render(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop);})();}
</script>
</body>
</html>
